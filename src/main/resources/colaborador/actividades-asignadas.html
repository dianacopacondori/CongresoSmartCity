<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis actividades asignadas</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css(v='20261027c')}" href="../static/css/style.css">
</head>
<body>
<header th:replace="~{fragments/navbar-publico :: navbar}"></header>
<main class="container" style="padding-top: 7rem; padding-bottom: 3rem">
  <h1>Mis actividades asignadas</h1>
  <p class="text-muted" th:text="|Recorrido de consulta para ${#strings.toLowerCase(rol)}|">Actividades asignadas</p>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-striped align-middle mb-0">
        <thead><tr><th>Fecha</th><th>Horario</th><th>Actividad</th><th>Tipo</th><th>Sala</th><th>Estado</th></tr></thead>
        <tbody>
        <tr th:each="actividad : ${actividades}">
          <td th:text="${actividad.fecha}">2027-01-15</td>
          <td th:text="|${actividad.horarioInicio} - ${actividad.horarioFin}|">09:00 - 10:00</td>
          <td th:text="${actividad.titulo}">Actividad</td>
          <td th:text="${actividad.tipo}">Taller</td>
          <td th:text="${actividad.sala}">Auditorio</td>
          <td th:text="${actividad.estado}">ACTIVA</td>
        </tr>
        <tr th:if="${#lists.isEmpty(actividades)}">
          <td colspan="6" class="text-center text-muted py-4">No tienes actividades asignadas.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
  <form class="mt-4" th:action="@{/usuarios/logout}" method="post">
    <button class="btn btn-outline-secondary" type="submit">Cerrar sesión</button>
  </form>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js(v='5.3.0')}"></script>
</body>
</html>
