<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Registro de pago</title><link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="public-page"><nav th:replace="~{fragments/navbar-publico :: navbar}"></nav><main class="container py-5 mt-5"><h1>Resultado de la simulación</h1>
  <div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div><p th:unless="${mensaje}">No hay una operación simulada reciente en esta sesión.</p>
  <a th:if="${pasoSiguiente == 'COMPLETAR_CUOTA'}" class="btn btn-primary" th:href="@{/pagos/mis-pagos}">Completar segunda cuota</a>
  <a th:if="${pasoSiguiente == 'VER_AGENDA'}" class="btn btn-primary" th:href="@{/inscripciones/mi-agenda}">Ver mi agenda</a>
  <a th:href="@{/pagos/mis-pagos}">Consultar mis pagos</a> · <a th:href="@{/dashboard-asistente}">Volver al panel</a>
</main><script th:src="@{/js/bootstrap.bundle.min.js(v='5.3.0')}" src="/js/bootstrap.bundle.min.js"></script></body></html>
