<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil - Smart City Congress</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="public-page">
<nav th:replace="~{fragments/navbar-publico :: navbar}"></nav>
<main class="container py-5 mt-5">
  <a th:href="@{/dashboard-asistente}">← Mi panel</a>
  <h1 class="mt-3">Mi perfil</h1>
  <div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

  <div class="card p-4" th:if="${asistente != null}">
    <p><strong>Identificación:</strong> <span th:text="${asistente.identificacion}">Documento</span></p>
    <p><strong>Correo:</strong> <span th:text="${asistente.correo}">Correo</span></p>
    <p class="text-muted">Para cambiar tu correo, identificación o contraseña, contacta a la organización.</p>

    <form th:action="@{/asistentes/mi-perfil}" th:object="${perfil}" method="post">
      <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
        Revisa los campos señalados antes de guardar.
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="nombres">Nombres *</label>
          <input class="form-control" id="nombres" th:field="*{nombres}" maxlength="100" required>
          <div class="text-danger small" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="apellidos">Apellidos *</label>
          <input class="form-control" id="apellidos" th:field="*{apellidos}" maxlength="100" required>
          <div class="text-danger small" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="telefono">Teléfono</label>
          <input class="form-control" id="telefono" type="tel" th:field="*{telefono}" maxlength="20">
          <div class="text-danger small" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="edad">Edad</label>
          <input class="form-control" id="edad" type="number" th:field="*{edad}" min="16" max="100">
          <div class="text-danger small" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="procedencia">Procedencia</label>
          <input class="form-control" id="procedencia" th:field="*{procedencia}" maxlength="100">
          <div class="text-danger small" th:if="${#fields.hasErrors('procedencia')}" th:errors="*{procedencia}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="ocupacion">Ocupación</label>
          <input class="form-control" id="ocupacion" th:field="*{ocupacion}" maxlength="100">
          <div class="text-danger small" th:if="${#fields.hasErrors('ocupacion')}" th:errors="*{ocupacion}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="universidad">Universidad</label>
          <input class="form-control" id="universidad" th:field="*{universidad}" maxlength="100">
          <div class="text-danger small" th:if="${#fields.hasErrors('universidad')}" th:errors="*{universidad}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="empresa">Empresa</label>
          <input class="form-control" id="empresa" th:field="*{empresa}" maxlength="100">
          <div class="text-danger small" th:if="${#fields.hasErrors('empresa')}" th:errors="*{empresa}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="modalidadPagoPreferida">Modalidad de pago preferida</label>
          <select class="form-select" id="modalidadPagoPreferida" th:field="*{modalidadPagoPreferida}">
            <option value="">Sin preferencia</option>
            <option value="COMPLETO">Completo</option>
            <option value="CUOTAS">Cuotas</option>
          </select>
          <div class="text-danger small" th:if="${#fields.hasErrors('modalidadPagoPreferida')}" th:errors="*{modalidadPagoPreferida}"></div>
        </div>
      </div>
      <button class="btn btn-primary mt-4" type="submit">Guardar cambios</button>
    </form>
  </div>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js(v='5.3.0')}" src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
