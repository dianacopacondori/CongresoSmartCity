<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponentes - Smart City Congress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="public-page">
<nav th:replace="~{fragments/navbar-publico :: navbar}"></nav>
<main class="container py-5">
  <h1>Ponentes del congreso</h1>
  <p>Conoce a quienes compartirán sus ideas sobre ciudades inteligentes.</p>
  <div class="row g-4" th:if="${!ponentes.empty}">
    <div class="col-md-4" th:each="ponente : ${ponentes}">
      <article class="card h-100"><div class="card-body">
        <h2 class="h5" th:text="${ponente.nombres + ' ' + ponente.apellidos}">Nombre</h2>
        <p th:text="${ponente.institucion}">Institución</p>
      </div></article>
    </div>
  </div>
  <p th:if="${ponentes.empty}">Pronto anunciaremos a las personas invitadas.</p>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
