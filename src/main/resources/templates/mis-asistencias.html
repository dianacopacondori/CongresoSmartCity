<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis asistencias</title><link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="public-page"><nav th:replace="~{fragments/navbar-publico :: navbar}"></nav><main class="container py-5 mt-5"><a th:href="@{/dashboard-asistente}">← Mi panel</a><h1 class="mt-3">Mis asistencias</h1>
  <p th:if="${asistencias == null or #lists.isEmpty(asistencias)}">Todavía no tienes asistencias registradas.</p>
  <div class="table-responsive" th:if="${asistencias != null and not #lists.isEmpty(asistencias)}"><table class="table table-striped"><thead><tr><th>Actividad</th><th>Fecha</th><th>Hora</th><th>Estado</th></tr></thead><tbody>
    <tr th:each="registro : ${asistencias}"><td th:text="${registro.actividad != null ? registro.actividad.titulo : '—'}">Actividad</td><td th:text="${registro.fecha}">Fecha</td><td th:text="${registro.hora}">Hora</td><td th:text="${registro.estado}">Estado</td></tr>
  </tbody></table></div></main><script th:src="@{/js/bootstrap.bundle.min.js(v='5.3.0')}" src="/js/bootstrap.bundle.min.js"></script></body></html>
