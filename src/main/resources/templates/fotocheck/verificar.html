<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificar fotocheck | Administración</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="dashboard-page dashboard-admin-page">
<header th:replace="~{fragments/navbar-admin :: topbar}"></header>
<aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside>
<div th:replace="~{fragments/navbar-admin :: overlay}"></div>
<main class="admin-main"><div class="admin-main-inner">
  <h1>Verificar fotocheck</h1>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
  <form th:action="@{/fotocheck/admin/verificar}" method="post" class="card p-4 mb-3">
    <label class="form-label" for="codigo">Código del fotocheck</label>
    <input id="codigo" name="codigo" type="number" min="1" class="form-control mb-3" required th:value="${codigoConsultado}">
    <button class="btn btn-primary" type="submit">Verificar</button>
  </form>
  <div th:if="${codigoConsultado != null}" class="alert" th:classappend="${valido} ? 'alert-success' : 'alert-danger'">
    <span th:text="${valido} ? 'FOTOCHECK VÁLIDO' : 'FOTOCHECK NO VÁLIDO'">Resultado</span>
  </div>
  <div th:if="${valido and fotocheck != null}" class="card p-4">
    <p><strong>Código:</strong> <span th:text="${fotocheck.codigo}">1</span></p>
    <p><strong>Asistente:</strong> <span th:text="|${fotocheck.nombres} ${fotocheck.apellidos}|">Nombre</span></p>
    <p><strong>Rol:</strong> <span th:text="${fotocheck.tipoUsuario}">ASISTENTE</span></p>
    <p><strong>Emitido:</strong> <span th:text="${fotocheck.fechaEmision}">2026-11-22</span></p>
  </div>
</div></main>
<th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block>
</body>
</html>
