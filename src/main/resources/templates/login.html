<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Smart City Congress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
    }
    .login-card {
        max-width: 450px;
        margin: auto;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <h2>🏙️ Smart City Congress</h2>
      <p class="text-muted">Inicia sesión en tu cuenta</p>
    </div>

    <!-- Mensajes de error/éxito -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <form th:action="@{/usuarios/login}" method="post">
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" name="correo"
               placeholder="usuario@ejemplo.com" required>
      </div>
      <div class="mb-3">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="contrasena" name="contrasena"
               placeholder="••••••••" required>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="recordar">
        <label class="form-check-label" for="recordar">Recordarme</label>
      </div>
      <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
    </form>

    <div class="text-center mt-3">
      <a th:href="@{/usuarios/registro}" class="text-decoration-none">¿No tienes cuenta? Regístrate</a>
    </div>
    <div class="text-center mt-2">
      <a th:href="@{/}" class="text-decoration-none small">← Volver al inicio</a>
    </div>
  </div>
</div>
</body>
</html>
