<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resultado del reporte | Administración</title><link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="dashboard-page dashboard-admin-page"><header th:replace="~{fragments/navbar-admin :: topbar}"></header><aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside><div th:replace="~{fragments/navbar-admin :: overlay}"></div><main class="admin-main"><div class="admin-main-inner"><a th:href="@{/reportes/admin/menu}">← Nuevo reporte</a><h1>Resultado del reporte</h1>
  <div th:if="${reporte != null}"><p><strong>Tipo:</strong> <span th:text="${reporte.tipo}">Tipo</span></p><p th:if="${reporte.fechaGeneracion != null}">Generado: <span th:text="${reporte.fechaGeneracion}">Fecha</span></p><p th:if="${reporte.periodo != null}" th:text="${reporte.periodo}">Período</p>
    <p th:if="${reporte.resultados == null or #lists.isEmpty(reporte.resultados)}">No se encontraron resultados.</p>
    <ul class="list-group" th:if="${reporte.resultados != null}"><li class="list-group-item" th:each="fila : ${reporte.resultados}" th:text="${fila}">Resultado</li></ul>
    <a class="btn btn-outline-primary mt-3" th:href="@{/reportes/admin/exportar-excel(tipo=${reporte.tipo})}">Descargar Excel</a>
  </div></div></main><th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block></body></html>
