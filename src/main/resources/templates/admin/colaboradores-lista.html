<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colaboradores</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css(v='20261027c')}" href="../static/css/style.css">
</head>
<body class="dashboard-page dashboard-admin-page">
<header th:replace="~{fragments/navbar-admin :: topbar}"></header>
<aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside>
<div th:replace="~{fragments/navbar-admin :: overlay}"></div>
<main class="admin-main">
  <div class="admin-main-inner">
    <header class="form-page-header mb-4">
      <div>
        <span class="section-kicker d-block mt-3">GESTIÓN</span>
        <h1>Colaboradores, instructores y ponentes</h1>
      </div>
      <a class="btn btn-primary" th:href="@{/admin/colaboradores/nuevo}">Registrar colaborador</a>
    </header>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form class="card card-body mb-4" method="get" th:action="@{/admin/colaboradores}">
      <div class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label" for="busqueda">Código, nombre, institución o empresa</label>
          <input class="form-control" id="busqueda" name="busqueda" th:value="${busqueda}">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="tipo">Tipo</label>
          <select class="form-select" id="tipo" name="tipo">
            <option value="">Todos</option>
            <option th:each="opcion : ${tipos}" th:value="${opcion}" th:text="${opcion}"
                    th:selected="${opcion == tipoSeleccionado}">PONENTE</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label" for="estado">Estado</label>
          <select class="form-select" id="estado" name="estado">
            <option value="">Todos</option>
            <option th:each="opcion : ${estados}" th:value="${opcion}" th:text="${opcion}"
                    th:selected="${opcion == estadoSeleccionado}">ACTIVO</option>
          </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
          <button class="btn btn-outline-primary" type="submit">Buscar</button>
          <a class="btn btn-outline-secondary" th:href="@{/admin/colaboradores}">Limpiar</a>
        </div>
      </div>
    </form>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead><tr><th>Código</th><th>Nombre</th><th>Tipo</th><th>Institución</th><th>Empresa</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
          <tr th:each="colaborador : ${colaboradores}">
            <td th:text="${colaborador.codigo}">1</td>
            <td>
              <span th:text="|${colaborador.nombres} ${colaborador.apellidos}|">Nombre</span>
              <small class="d-block text-muted" th:text="${colaborador.correo}">correo</small>
            </td>
            <td th:text="${colaborador.tipoColaborador}">PONENTE</td>
            <td th:text="${colaborador.institucion}">Institución</td>
            <td th:text="${colaborador.empresa}">Empresa</td>
            <td th:text="${colaborador.estado}">ACTIVO</td>
            <td class="d-flex gap-2">
              <a class="btn btn-sm btn-outline-primary"
                 th:href="@{/admin/colaboradores/editar/{id}(id=${colaborador.codigo})}">Editar</a>
              <form th:if="${colaborador.estado.name() != 'ELIMINADO'}"
                    th:action="@{/admin/colaboradores/eliminar/{id}(id=${colaborador.codigo})}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit">Dar de baja</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(colaboradores)}">
            <td colspan="7" class="text-center text-muted py-4">No hay colaboradores que coincidan con la búsqueda.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block>
</body>
</html>
