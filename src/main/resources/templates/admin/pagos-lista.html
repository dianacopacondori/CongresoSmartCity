<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pagos | Administración</title><link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="dashboard-page dashboard-admin-page"><header th:replace="~{fragments/navbar-admin :: topbar}"></header><aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside><div th:replace="~{fragments/navbar-admin :: overlay}"></div><main class="admin-main"><div class="admin-main-inner"><h1>Pagos</h1>
  <form th:action="@{/pagos/admin/listar}" method="get" class="d-flex gap-2 mb-3"><label for="estado" class="visually-hidden">Estado</label><select id="estado" class="form-select" name="estado"><option value="">Todos</option><option value="PENDIENTE" th:selected="${param.estado != null and param.estado[0] == 'PENDIENTE'}">Pendiente</option><option value="PARCIAL" th:selected="${param.estado != null and param.estado[0] == 'PARCIAL'}">Parcial</option><option value="PAGADO" th:selected="${param.estado != null and param.estado[0] == 'PAGADO'}">Pagado</option></select><button class="btn btn-primary" type="submit">Filtrar</button></form>
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <p th:if="${pagos == null or #lists.isEmpty(pagos)}">No hay pagos para mostrar.</p>
  <div class="table-responsive" th:if="${pagos != null and not #lists.isEmpty(pagos)}"><table class="table table-striped"><thead><tr><th>Código</th><th>Asistente</th><th>Inscripción</th><th>Importe</th><th>Saldo</th><th>Fecha</th><th>Estado</th><th>Abono</th></tr></thead><tbody><tr th:each="pago : ${pagos}">
    <td th:text="${pago.codigoPago}">1</td><td th:text="${pago.asistente != null ? pago.asistente.nombres + ' ' + pago.asistente.apellidos : '—'}">Asistente</td><td th:text="${pago.inscripcion != null ? pago.inscripcion.codigo : '—'}">Inscripción</td><td th:text="${pago.importe}">Importe</td><td th:text="${pago.saldo}">Saldo</td><td th:text="${pago.fechaPago}">Fecha</td><td th:text="${pago.estado}">Estado</td>
    <td><form th:if="${pago.saldo > 0}" th:action="@{/pagos/admin/registrar-cuota/{id}(id=${pago.codigoPago})}" method="post" class="d-flex gap-2"><label class="visually-hidden" th:for="|monto-${pago.codigoPago}|">Monto del abono</label><input class="form-control form-control-sm" type="number" name="monto" th:id="|monto-${pago.codigoPago}|" min="0.01" step="0.01" th:max="${pago.saldo}" required><button class="btn btn-sm btn-primary" type="submit">Abonar</button></form></td>
  </tr></tbody></table></div>
</div></main><th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block></body></html>
