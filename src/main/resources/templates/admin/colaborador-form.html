<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${edicion} ? 'Editar colaborador' : 'Nuevo colaborador'">Colaborador</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css(v='20261027c')}" href="../static/css/style.css">
</head>
<body class="dashboard-page dashboard-admin-page">
<header th:replace="~{fragments/navbar-admin :: topbar}"></header>
<aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside>
<div th:replace="~{fragments/navbar-admin :: overlay}"></div>
<main class="admin-main">
  <div class="admin-main-inner">
    <header class="form-page-header mb-4">
      <div>
        <a th:href="@{/admin/colaboradores}" class="back-link">Volver a colaboradores</a>
        <h1 class="mt-3" th:text="${edicion} ? 'Editar colaborador' : 'Registrar colaborador'">Colaborador</h1>
      </div>
    </header>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="card card-body" th:object="${form}"
          th:action="${edicion} ? @{/admin/colaboradores/editar/{id}(id=${id})} : @{/admin/colaboradores}"
          method="post">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="nombres">Nombres *</label>
          <input class="form-control" id="nombres" th:field="*{nombres}" maxlength="100" required>
          <div class="invalid-feedback d-block" th:errors="*{nombres}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="apellidos">Apellidos *</label>
          <input class="form-control" id="apellidos" th:field="*{apellidos}" maxlength="100" required>
          <div class="invalid-feedback d-block" th:errors="*{apellidos}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="identificacion">Identificación *</label>
          <input class="form-control" id="identificacion" th:field="*{identificacion}" maxlength="20" required>
          <div class="invalid-feedback d-block" th:errors="*{identificacion}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="correo">Correo *</label>
          <input class="form-control" id="correo" type="email" th:field="*{correo}" maxlength="254" required>
          <div class="invalid-feedback d-block" th:errors="*{correo}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="telefono">Teléfono</label>
          <input class="form-control" id="telefono" th:field="*{telefono}" maxlength="20">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="tipoColaborador">Tipo *</label>
          <select class="form-select" id="tipoColaborador" th:field="*{tipoColaborador}" required>
            <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}">PONENTE</option>
          </select>
          <div class="invalid-feedback d-block" th:errors="*{tipoColaborador}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="institucion">Institución</label>
          <input class="form-control" id="institucion" th:field="*{institucion}" maxlength="150">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="empresa">Empresa</label>
          <input class="form-control" id="empresa" th:field="*{empresa}" maxlength="150">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="contrasena"
                 th:text="${edicion} ? 'Nueva contraseña (opcional)' : 'Contraseña inicial *'">Contraseña</label>
          <input class="form-control" id="contrasena" type="password" th:field="*{contrasena}"
                 autocomplete="new-password" maxlength="72" th:required="${!edicion}">
          <div class="form-text" th:if="${edicion}">Déjala vacía para conservar la contraseña actual.</div>
          <div class="invalid-feedback d-block" th:errors="*{contrasena}"></div>
        </div>
        <div class="col-md-6 mb-3" th:if="${edicion}">
          <label class="form-label" for="estado">Estado</label>
          <select class="form-select" id="estado" th:field="*{estado}">
            <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}">ACTIVO</option>
          </select>
        </div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/admin/colaboradores}">Cancelar</a>
        <button class="btn btn-primary" type="submit"
                th:text="${edicion} ? 'Guardar cambios' : 'Registrar'">Guardar</button>
      </div>
    </form>
  </div>
</main>
<th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block>
</body>
</html>
