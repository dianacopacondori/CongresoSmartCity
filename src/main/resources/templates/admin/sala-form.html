<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${edicion} ? 'Editar sala' : 'Nueva sala'">Sala</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css(v='20261027c')}" href="../static/css/style.css">
</head>
<body class="dashboard-page dashboard-admin-page">
<header th:replace="~{fragments/navbar-admin :: topbar}"></header>
<aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside>
<div th:replace="~{fragments/navbar-admin :: overlay}"></div>
<main class="admin-main">
  <div class="admin-main-inner">
    <header class="form-page-header mb-4">
      <div>
        <a th:href="@{/admin/salas}" class="back-link">Volver a salas</a>
        <h1 class="mt-3" th:text="${edicion} ? 'Editar sala' : 'Nueva sala'">Sala</h1>
      </div>
    </header>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form class="card card-body" th:object="${form}"
          th:action="${edicion} ? @{/admin/salas/editar/{id}(id=${id})} : @{/admin/salas}" method="post">
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre *</label>
        <input class="form-control" id="nombre" th:field="*{nombre}" maxlength="100" required>
        <div class="invalid-feedback d-block" th:errors="*{nombre}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="capacidad">Capacidad *</label>
        <input class="form-control" id="capacidad" type="number" th:field="*{capacidad}" min="1" required>
        <div class="invalid-feedback d-block" th:errors="*{capacidad}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="ubicacion">Ubicación</label>
        <input class="form-control" id="ubicacion" th:field="*{ubicacion}" maxlength="200">
        <div class="invalid-feedback d-block" th:errors="*{ubicacion}"></div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" th:href="@{/admin/salas}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</main>
<th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block>
</body>
</html>
