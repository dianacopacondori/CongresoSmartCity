<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Asistencias | Administración</title><link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="dashboard-page dashboard-admin-page"><header th:replace="~{fragments/navbar-admin :: topbar}"></header><aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside><div th:replace="~{fragments/navbar-admin :: overlay}"></div><main class="admin-main"><div class="admin-main-inner"><h1>Asistencias</h1><a class="btn btn-primary mb-3" th:href="@{/asistencias/registrar}">Registrar asistencia</a>
  <form th:action="@{/asistencias/admin/listar}" method="get" class="d-flex gap-2 mb-3"><label for="actividadId" class="visually-hidden">Código de actividad</label><input id="actividadId" type="number" min="1" name="actividadId" class="form-control" placeholder="Código de actividad" th:value="${param.actividadId}"><button type="submit" class="btn btn-outline-primary">Filtrar</button></form>
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <p th:if="${asistencias == null or #lists.isEmpty(asistencias)}">No hay asistencias registradas.</p>
  <div class="table-responsive" th:if="${asistencias != null and not #lists.isEmpty(asistencias)}"><table class="table table-striped"><thead><tr><th>Código</th><th>Asistente</th><th>Actividad</th><th>Fecha</th><th>Hora</th><th>Estado</th><th>Corrección</th></tr></thead><tbody><tr th:each="registro : ${asistencias}">
    <td th:text="${registro.codigo}">1</td><td th:text="${registro.asistente != null ? registro.asistente.nombres + ' ' + registro.asistente.apellidos : '—'}">Asistente</td><td th:text="${registro.actividad != null ? registro.actividad.titulo : '—'}">Actividad</td><td th:text="${registro.fecha}">Fecha</td><td th:text="${registro.hora}">Hora</td><td th:text="${registro.estado}">Estado</td>
    <td><form th:action="@{/asistencias/admin/corregir/{id}(id=${registro.codigo})}" method="post" class="d-flex gap-2"><label class="visually-hidden" th:for="|justificacion-${registro.codigo}|">Justificación</label><input class="form-control form-control-sm" name="justificacion" th:id="|justificacion-${registro.codigo}|" placeholder="Justificación" required maxlength="255"><button type="submit" class="btn btn-sm btn-outline-primary">Corregir</button></form></td>
  </tr></tbody></table></div>
</div></main><th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block></body></html>
