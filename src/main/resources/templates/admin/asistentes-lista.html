<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Asistentes | Administración</title><link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="dashboard-page dashboard-admin-page"><header th:replace="~{fragments/navbar-admin :: topbar}"></header><aside th:replace="~{fragments/navbar-admin :: sidebar}"></aside><div th:replace="~{fragments/navbar-admin :: overlay}"></div><main class="admin-main"><div class="admin-main-inner"><h1>Asistentes</h1>
  <form th:action="@{/asistentes/admin/listar}" method="get" class="d-flex gap-2 mb-3"><label for="busqueda" class="visually-hidden">Buscar por nombre</label><input id="busqueda" class="form-control" name="busqueda" placeholder="Buscar por nombre" th:value="${param.busqueda}"><button class="btn btn-primary" type="submit">Buscar</button></form>
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <p th:if="${asistentes == null or #lists.isEmpty(asistentes)}">No se encontraron asistentes.</p>
  <div class="table-responsive" th:if="${asistentes != null and not #lists.isEmpty(asistentes)}"><table class="table table-striped"><thead><tr><th>Código</th><th>Nombre</th><th>Correo</th><th>Identificación</th><th>Estado</th></tr></thead><tbody><tr th:each="asistente : ${asistentes}">
    <td th:text="${asistente.codigo}">1</td><td th:text="|${asistente.nombres} ${asistente.apellidos}|">Nombre</td><td th:text="${asistente.correo}">Correo</td><td th:text="${asistente.identificacion}">Documento</td><td th:text="${asistente.estado}">Estado</td>
  </tr></tbody></table></div><p class="text-muted">Suspensión y eliminación pendientes de migrar a acciones POST seguras.</p>
</div></main><th:block th:replace="~{fragments/navbar-admin :: scripts}"></th:block></body></html>
