<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear nueva contraseña</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="public-page">
<nav th:replace="~{fragments/navbar-publico :: navbar}"></nav>
<main class="container py-5 mt-5">
  <section class="card mx-auto p-4" style="max-width: 32rem">
    <h1 class="h3">Crear nueva contraseña</h1>
    <form th:action="@{/recuperar/{token}(token=${token})}" method="post">
      <label for="contrasena" class="form-label">Nueva contraseña</label>
      <input id="contrasena" name="contrasena" type="password" class="form-control mb-3"
             minlength="8" maxlength="100" autocomplete="new-password" required>
      <button type="submit" class="btn btn-primary w-100">Restablecer contraseña</button>
    </form>
    <a class="mt-3" th:href="@{/usuarios/login}">Volver a iniciar sesión</a>
  </section>
</main>
</body>
</html>
