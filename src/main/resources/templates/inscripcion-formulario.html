<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inscripción | Smart City Congress</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="public-page"><nav th:replace="~{fragments/navbar-publico :: navbar}"></nav>
<main class="container py-5 mt-5"><a th:href="@{/dashboard-asistente}">← Mi panel</a><h1 class="mt-3">Inscríbete al congreso</h1>
  <p th:if="${usuario != null}" th:text="|Hola, ${usuario.nombres}. Selecciona tu tipo de inscripción.|">Selecciona tu tipo de inscripción.</p>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <form th:action="@{/inscripciones/nueva}" method="post" class="card p-4 col-lg-6">
    <label class="form-label" for="tipo">Tipo de inscripción</label>
    <select id="tipo" name="tipo" class="form-select mb-3" required><option value="">Selecciona una opción</option><option value="Estudiante">Estudiante</option><option value="Externo">Externo</option></select>
    <button type="submit" class="btn btn-primary">Crear inscripción</button>
  </form>
</main><script th:src="@{/js/bootstrap.bundle.min.js(v='5.3.0')}" src="/js/bootstrap.bundle.min.js"></script></body></html>
