<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro - Smart City Congress</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar-publico :: navbar}"></nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="text-center mb-4">Registro de Participante</h2>

          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

          <form th:action="@{/usuarios/registro}" th:object="${usuario}" method="post">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Nombres *</label>
                <input type="text" class="form-control" th:field="*{nombres}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Apellidos *</label>
                <input type="text" class="form-control" th:field="*{apellidos}" required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">DNI/RUC *</label>
                <input type="text" class="form-control" th:field="*{identificacion}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Edad</label>
                <input type="number" class="form-control" th:field="*{edad}" min="16" max="100">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Correo electrónico *</label>
              <input type="email" class="form-control" th:field="*{correo}" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Teléfono</label>
                <input type="tel" class="form-control" th:field="*{telefono}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Contraseña *</label>
                <input type="password" class="form-control" th:field="*{contrasena}"
                       minlength="8" required>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Procedencia</label>
                <input type="text" class="form-control" th:field="*{procedencia}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Ocupación</label>
                <input type="text" class="form-control" th:field="*{ocupacion}">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Universidad</label>
                <input type="text" class="form-control" th:field="*{universidad}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Empresa</label>
                <input type="text" class="form-control" th:field="*{empresa}">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Modalidad de pago preferida</label>
              <select class="form-select" th:field="*{modalidadPagoPreferida}">
                <option th:each="m : ${T(com.congreso.modelo.enums.ModalidadPago).values()}"
                        th:value="${m}" th:text="${m}">COMPLETO</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Registrarme</button>
          </form>

          <p class="text-center mt-3">
            ¿Ya tienes cuenta? <a th:href="@{/usuarios/login}">Inicia sesión</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
