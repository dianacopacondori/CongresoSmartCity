<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña</title>
  <link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="public-page">
<nav th:replace="~{fragments/navbar-publico :: navbar}"></nav>
<main class="container py-5 mt-5">
  <section class="card mx-auto p-4" style="max-width: 32rem">
    <h1 class="h3">Recuperar contraseña</h1>
    <div th:if="${mensaje}" class="alert alert-info" role="status" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <form th:action="@{/recuperar}" method="post">
      <label for="correo" class="form-label">Correo electrónico</label>
      <input id="correo" name="correo" type="email" class="form-control mb-3" required maxlength="254">
      <button type="submit" class="btn btn-primary w-100">Enviar instrucciones</button>
    </form>
    <a class="mt-3" th:href="@{/usuarios/login}">Volver a iniciar sesión</a>
  </section>
</main>
</body>
</html>
