<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi agenda</title><link th:href="@{/css/bootstrap.min.css(v='5.3.0')}" href="/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css"></head>
<body class="public-page"><nav th:replace="~{fragments/navbar-publico :: navbar}"></nav><main class="container py-5 mt-5">
  <a th:href="@{/dashboard-asistente}">← Mi panel</a><h1 class="mt-3">Mi agenda</h1>
  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div th:if="${estadoNotificacion}" class="alert alert-info" th:text="${estadoNotificacion}"></div>
  <p th:if="${actividades == null or #lists.isEmpty(actividades)}">Todavía no tienes actividades en tu agenda confirmada.</p>
  <div class="row g-3" th:if="${actividades != null}"><div class="col-md-6" th:each="act : ${actividades}">
    <article class="card h-100 p-4"><h2 class="h5" th:text="${act.titulo}">Actividad</h2>
      <p th:text="${act.descripcion}">Descripción</p><p><span th:text="${act.fecha}">Fecha</span> · <span th:text="${act.horarioInicio}">Inicio</span>–<span th:text="${act.horarioFin}">Fin</span></p>
      <p th:if="${act.sala != null}" th:text="|Sala: ${act.sala.nombre}|">Sala</p></article>
  </div></div><a class="btn btn-outline-primary mt-4" th:href="@{/actividades}">Explorar actividades</a>
</main><script th:src="@{/js/bootstrap.bundle.min.js(v='5.3.0')}" src="/js/bootstrap.bundle.min.js"></script></body></html>
