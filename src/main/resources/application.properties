spring.profiles.active=dev,local

# Configuracion de PostgreSQL (credenciales fuera del repositorio)
spring.datasource.url=jdbc:postgresql://localhost:5433/congreso_smart_city
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA/Hibernate (sin SQL ni datos personales en los logs)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuracion de Mail (para notificaciones)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuracion del servidor y de la sesion
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax