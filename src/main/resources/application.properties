# Las credenciales NO estan en el repositorio: vienen de variables de entorno o del
# archivo local no versionado application-local.properties, que se importa siempre que
# existe. Si no existe y no hay variables de entorno, el arranque falla de forma clara.
# Perfiles: SPRING_PROFILES_ACTIVE=dev solo para crear el esquema (ddl-auto=update).
spring.config.import=optional:classpath:application-local.properties

# Configuracion de PostgreSQL (credenciales fuera del repositorio)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/congreso_smart_city}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA/Hibernate: entornos compartidos validan el esquema.
# El perfil "dev" habilita "update" solo para construir el esquema local.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Configuracion de Mail (para notificaciones)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuracion del servidor y de la sesion
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
